# SOARVIBE 免費後端代理（Cloudflare Workers）
#
# === 部署步驟（CMD）===
#   cd worker
#   wrangler login
#
#   【Gemini — 4 把免費金鑰輪替，一行貼上，逗號分隔】
#   wrangler secret put GEMINI_API_KEYS
#   例：AIzaSyAAA,AIzaSyBBB,AIzaSyCCC,AIzaSyDDD
#   ※ 已綁付費、不想扣款的金鑰「不要放進來」
#
#   【Google Maps — 必填（若要用 Places / 地圖）】
#   wrangler secret put GOOGLE_MAPS_API_KEY
#
#   wrangler deploy
#   → 把 workers.dev 網址填到 index.html 的 SOARVIBE_API_BASE
#
#   驗證：curl https://你的worker.dev/api/health
#   應看到 geminiKeyCount: 4, maps: true, citySharesR2: configured

name = "soarvibe-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

[vars]
# Firebase Hosting is the primary PWA origin; GitHub Pages remains a mirror.
# Write routes (upload/delete) only echo ACAO when Origin is in this list — never *.
ALLOWED_ORIGINS = "https://soarvibe-885c8.web.app,https://soarvibe-885c8.firebaseapp.com,https://asd22584812.github.io,http://localhost:8787,http://127.0.0.1:8787,http://localhost:3000,http://127.0.0.1:3000"
FIREBASE_PROJECT_ID = "soarvibe-885c8"
# Keep empty — R2 Public Access stays Disabled; images served via Worker GET only.
CITY_SHARES_PUBLIC_BASE = ""
CITY_SHARES_WORKER_PUBLIC_BASE = "https://soarvibe-api.soarvibe.workers.dev"

# City Shares images (Cloudflare R2 — NOT Firebase Storage).
# Production bucket already exists; do NOT set preview_bucket_name (avoids blocking prod deploy).
[[r2_buckets]]
binding = "CITY_SHARES_BUCKET"
bucket_name = "soarvibe-city-shares"

# Upload quotas / draft post claims (billing safety)
[[kv_namespaces]]
binding = "CITY_SHARES_LIMITS"
id = "4e1aebea2565456797b5f47fd6aa846b"
