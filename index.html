            }
            applyStandaloneClass();
            window.matchMedia('(display-mode: standalone)').addEventListener('change', applyStandaloneClass);
        })();

            function withTimeout(promise, ms, code) {
                return new Promise(function (resolve, reject) {
                    var settled = false;
                    var timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        var err = new Error(code || 'TIMEOUT');
                        err.code = code || 'TIMEOUT';
                        reject(err);
                    }, ms);
                    Promise.resolve(promise).then(
                        function (value) {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            resolve(value);
                        },
                        function (err) {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            reject(err);
                        }
                    );
                });
            }

            function toPlacesLatLngLiteral(point) {
                if (!point) return { lat: 0, lng: 0 };
                return {
                    lat: Number(point.lat),
                    lng: Number(point.lng)
                };
            }

            /** ???? JS Places API?locationRestriction ??{ center, radius }????circle */
            function buildPlacesNearbyRestriction(center, radiusM) {
                return {
                    center: toPlacesLatLngLiteral(center),
                    radius: Math.min(Math.max(Number(radiusM) || 1500, 1), 50000)
                };
            }

            /** ???? JS Places API?locationBias ??? LatLngLiteral ??{ center, radius } */
            function buildPlacesTextBias(center, radiusM) {
                var c = toPlacesLatLngLiteral(center);
                var r = Number(radiusM);
                if (r > 0) {
                    return {
                        center: c,
                        radius: Math.min(r, 50000)
                    };
                }
                return c;
            }

                AUTH.loadPrivateDoc('notes').then(function (notes) {
                    if (!notes) return;
                    if (userNoteShopping && notes.shopping != null) userNoteShopping.value = notes.shopping;
                    if (userNoteFood && notes.food != null) userNoteFood.value = notes.food;
                    if (userNoteSpots && notes.spots != null) userNoteSpots.value = notes.spots;
                    try {
                        localStorage.setItem(USER_NOTES_KEY, JSON.stringify({

                            food: userNoteFood ? userNoteFood.value : '',
                            spots: userNoteSpots ? userNoteSpots.value : ''
                        }));
                    } catch (e) { /* silent */ }
                });
                AUTH.loadPrivateDoc('checklist').then(function (doc) {
                    if (!doc || !doc.items || !userChecklist) return;
                    var checklist = doc.items;
                    userChecklist.querySelectorAll('.user-check-item').forEach(function (li) {
                        var id = li.getAttribute('data-check-id');
                        var cb = li.querySelector('input[type="checkbox"]');
                        if (id && cb && checklist[id] != null) {

            function calcTripDayNight(meta) {

                    return { days: 0, nights: 0, label: '' };
                }
                var start = new Date(meta.dateStart + 'T00:00:00');
                var end = new Date(meta.dateEnd + 'T00:00:00');
                if (isNaN(start.getTime()) || isNaN(end.getTime())) {
                    return { days: 0, nights: 0, label: '' };
                }
                var diff = Math.round((end.getTime() - start.getTime()) / 86400000);

                return { days: days, nights: nights, label: days + ' ??' + nights + ' ?? };

                if (totalHeight <= pageBudget(true)) {
                    html += renderDayPage(blocks.map(function (b) { return b.html; }), true, false);
                    return { html: html, pageCount: pageCount };
                }

                while (blockIdx < blocks.length || pendingPhase) {
                    var chunk = [];

                    var budget = pageBudget(isFirstPage);

                    if (pendingPhase) {
                        chunk.push(pendingPhase);
                        used += scaledHeight(BK_A4_PHASE);
                        pendingPhase = null;

                            var phaseH = scaledHeight(block.height);

                            if (used + phaseH > budget) {

                                if (used > 0) {

                            chunk.push(block.html);
                            used += bh;
                            blockIdx += 1;
                            break;
                        }

                        chunk.push(block.html);
                        used += bh;
                        blockIdx += 1;
                    }

                    if (!chunk.length) break;

                    if (chunk.length === 1 && isBookletPhaseBlockHtml(chunk[0])) {
                        pendingPhase = chunk[0];
                        continue;

                    var lonelyPhase = stripLonelyPhaseTail(chunk);

                getBookletCoverFetchUrls(destination).forEach(function (u) {
                    if (tryUrls.indexOf(u) === -1) tryUrls.push(u);
                });
                var ti;
                for (ti = 0; ti < tryUrls.length; ti++) {
                    try {
                        var resp = await fetch(tryUrls[ti], { cache: 'no-cache', mode: 'cors' });
                        if (resp.ok) {
                            var blob = await resp.blob();
                            if (blob && blob.size > 1500) {
                                var fromBlob = await blobToDataUrl(blob);
                                fromBlob = await normalizeCoverDataUrl(fromBlob);
                                if (isValidCoverDataUrl(fromBlob)) return fromBlob;
                            }
                        }
                    } catch (fetchErr) { /* try next */ }
                    try {
                        var viaImg = await loadImageAsDataUrl(tryUrls[ti], '');
                        viaImg = await normalizeCoverDataUrl(viaImg);
                        if (isValidCoverDataUrl(viaImg)) return viaImg;
                    } catch (imgErr) { /* try next */ }
                }
                return '';
            }

                        setTimeout(resolve, 350);

                    var pending = imgs.length;
                    function tick() {
                        pending--;

                    }
                    imgs.forEach(function (img) {
                        if (img.complete && img.naturalWidth) tick();
                        else {
                            img.onload = tick;
                            img.onerror = tick;
                        }
                    });
                    setTimeout(resolve, timeoutMs || 5000);

            function injectScriptIntoDoc(doc, src) {

                    if (!doc || !doc.head) {
                        reject(new Error('no capture doc head'));

                    }
                    var existing = doc.querySelector('script[data-booklet-src="' + src + '"]');
                    if (existing) {
                        if (existing.getAttribute('data-loaded') === '1') resolve();
                        else existing.addEventListener('load', resolve, { once: true });
                        return;
                    }
                    var script = doc.createElement('script');
                    script.src = src;
                    script.async = true;
                    script.setAttribute('data-booklet-src', src);
                    script.onload = function () {
                        script.setAttribute('data-loaded', '1');
                        resolve();
                    };
                    script.onerror = function () {
                        reject(new Error('iframe script load failed: ' + src));
                    };
                    doc.head.appendChild(script);
                });

            function reflowBookletDayPagesForPdf(doc) {
                if (!doc || !doc.body) return;
                doc.documentElement.classList.add('bk-pdf-export-mode');
                var win = doc.defaultView || window;
                var allPages = Array.prototype.slice.call(doc.querySelectorAll('.bk-day-page'));
                if (!allPages.length) return;

                var dayGroups = [];
                var g = null;
                allPages.forEach(function (page) {
                    var dn = getBookletDayNumFromPage(page);
                    if (!g || g.dayNum !== dn) {
                        g = { dayNum: dn, pages: [page] };
                        dayGroups.push(g);
                    } else {
                        g.pages.push(page);
                    }
                });

                dayGroups.forEach(function (group) {
                    var blocks = [];
                    group.pages.forEach(function (p) {
                        var b = p.querySelector('.bk-day-body');
                        if (!b) return;
                        while (b.firstChild) blocks.push(b.firstChild);
                    });

                    for (var ri = 1; ri < group.pages.length; ri++) {
                        var extra = group.pages[ri];
                        if (extra.parentNode) extra.parentNode.removeChild(extra);
                    }

                    var anchorPage = group.pages[0];
                    anchorPage.classList.remove('bk-day-continued');
                    var insertAfter = anchorPage;
                    var page = anchorPage;
                    var body = page.querySelector('.bk-day-body');
                    if (!body) return;
                    body.textContent = '';

                    var units = groupBookletBodyNodesIntoUnits(blocks);
                    var unitIdx = 0;
                    var pageIsFirst = true;

                    while (unitIdx < units.length) {
                        if (!pageIsFirst) {
                            page = createBookletContinuedDayPage(doc, anchorPage);
                            if (insertAfter.nextSibling) {
                                insertAfter.parentNode.insertBefore(page, insertAfter.nextSibling);
                            } else {
                                insertAfter.parentNode.appendChild(page);
                            }
                            insertAfter = page;
                            body = page.querySelector('.bk-day-body');
                        }

                        var placedOnPage = 0;
                        while (unitIdx < units.length) {
                            var unit = units[unitIdx];
                            var ui;
                            var phaseNode = unit[0];
                            var nextUnit = unitIdx + 1 < units.length ? units[unitIdx + 1] : null;
                            var nextNode = nextUnit && nextUnit[0] ? nextUnit[0] : null;
                            if (phaseNode.classList && phaseNode.classList.contains('bk-phase') &&
                                nextNode && nextNode.classList && nextNode.classList.contains('bk-act')) {
                                body.appendChild(phaseNode);
                                body.appendChild(nextNode);
                                lockBookletSheetForCapture(page);
                                if (bookletBlockCrossesWatermark(page, nextNode, win) || sheetHasCaptureOverflow(page)) {
                                    if (nextNode.parentNode === body) body.removeChild(nextNode);
                                    if (phaseNode.parentNode === body) body.removeChild(phaseNode);
                                    break;
                                }
                                unitIdx += 2;
                                placedOnPage += 1;
                                continue;
                            }
                            for (ui = 0; ui < unit.length; ui++) {
                                body.appendChild(unit[ui]);
                            }
                            lockBookletSheetForCapture(page);
                            var lastInUnit = unit[unit.length - 1];
                            if (bookletBlockCrossesWatermark(page, lastInUnit, win) || sheetHasCaptureOverflow(page)) {
                                for (ui = unit.length - 1; ui >= 0; ui--) {
                                    if (unit[ui].parentNode === body) {
                                        body.removeChild(unit[ui]);
                                    }
                                }
                                break;
                            }
                            unitIdx += 1;
                            placedOnPage += 1;
                        }

                        if (placedOnPage === 0 && unitIdx < units.length && units[unitIdx].length === 1) {
                            var forcedUnit = units[unitIdx];
                            forcedUnit.forEach(function (forcedNode) {
                                body.appendChild(forcedNode);
                            });
                            unitIdx += 1;
                        }

                        pageIsFirst = false;
                    }
                });

                fixOrphanPhaseHeadersInDoc(doc);
            }

            function fixOrphanPhaseHeadersInDoc(doc) {
                if (!doc || !doc.body) return;
                var pages = Array.prototype.slice.call(doc.querySelectorAll('.bk-day-page'));
                pages.forEach(function (page) {
                    var body = page.querySelector('.bk-day-body');
                    if (!body || !body.lastElementChild) return;
                    if (!body.lastElementChild.classList || !body.lastElementChild.classList.contains('bk-phase')) return;
                    var nextPage = page.nextElementSibling;
                    while (nextPage && (!nextPage.classList || !nextPage.classList.contains('bk-day-page'))) {
                        nextPage = nextPage.nextElementSibling;
                    }
                    if (!nextPage) return;
                    var nextBody = nextPage.querySelector('.bk-day-body');
                    if (!nextBody) return;
                    var phaseNode = body.lastElementChild;
                    body.removeChild(phaseNode);
                    nextBody.insertBefore(phaseNode, nextBody.firstChild);
                });
            }

            async function runBookletPdfInsideIframe(frame, frameDoc, onProgress, mobile) {
                return new Promise(function (resolve, reject) {
                    var settled = false;
                    var timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        reject(new Error('PDF generation timeout'));
                    }, mobile ? 180000 : 120000);

                    var pageImages = [];
                    var storePageImages = !mobile;

                    window.__SOARVIBE_PDF_RUN = {
                        progress: function (cur, total) {
                            if (onProgress) onProgress(cur, total);
                        },
                        pageImage: function (url) {
                            if (url && storePageImages) pageImages.push(url);
                        },
                        done: function (blob) {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            resolve({ blob: blob, pageImages: pageImages.slice() });
                        },
                        fail: function (msg) {
                            if (settled) return;
                            settled = true;
                            clearTimeout(timer);
                            reject(new Error(msg || 'PDF iframe failed'));
                        }
                    };

                    try {
                        var runner = frameDoc.createElement('script');
                        runner.setAttribute('data-booklet-pdf-runner', '1');
                        runner.textContent = buildBookletIframePdfRunnerScript(!!mobile);
                        frameDoc.body.appendChild(runner);
                    } catch (injectErr) {
                        settled = true;
                        clearTimeout(timer);
                        reject(injectErr);
                    }
                }).finally(function () {
                    try {
                        delete window.__SOARVIBE_PDF_RUN;
                    } catch (ignoreDel) { /* silent */ }
                });
            }

            function writeBookletPreviewFrame(frame, printHtml) {
                return new Promise(function (resolve) {
                    if (!frame) {
                        resolve(false);
                        return;
                    }
                    function inject() {
                        try {
                            var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
                            if (!doc) {
                                resolve(false);
                                return;
                            }
                            doc.open();
                            doc.write(printHtml);
                            doc.close();
                            resolve(true);
                        } catch (writeErr) {
                            console.warn('[SOARVIBE] writeBookletPreviewFrame:', writeErr);
                            resolve(false);
                        }
                    }
                    if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.src !== 'about:blank') {
                        frame.src = 'about:blank';
                        frame.onload = function () {
                            frame.onload = null;
                            inject();
                        };
                        return;
                    }
                    frame.onload = function () {
                        frame.onload = null;
                        inject();
                    };
                    frame.src = 'about:blank';
                });
            }

            function addBookletCanvasToPdf(pdf, canvas, imgData) {
                if (!pdf || !canvas || !imgData) {
                    throw new Error('invalid pdf canvas');
                }
                var pdfW = BOOKLET_PDF_A4_MM_W;
                var pdfH = BOOKLET_PDF_A4_MM_H;
                var cW = canvas.width || BOOKLET_PDF_PAGE_W;
                var cH = canvas.height || BOOKLET_PDF_PAGE_H;
                var canvasAspect = cW / cH;
                var a4Aspect = pdfW / pdfH;
                var drawW;
                var drawH;
                var drawX;
                var drawY;
                if (Math.abs(canvasAspect - a4Aspect) < 0.02) {
                    drawW = pdfW;
                    drawH = pdfH;
                    drawX = 0;
                    drawY = 0;
                } else if (canvasAspect > a4Aspect) {
                    drawH = pdfH;
                    drawW = pdfH * canvasAspect;
                    drawX = (pdfW - drawW) / 2;
                    drawY = 0;
                } else {
                    drawW = pdfW;
                    drawH = pdfW / canvasAspect;
                    drawX = 0;
                    drawY = (pdfH - drawH) / 2;
                }
                pdf.addImage(imgData, 'JPEG', drawX, drawY, drawW, drawH, undefined, 'FAST');
            }

            function parseDaysFromMarkdown(md) {
                var lines = md.split('\n');
                var days = [];
                var current = null;

                lines.forEach(function (line) {
                    var trimmed = line.trim();
                    var dayMatch = trimmed.match(/Day\s*(\d+)/i);
                    if (dayMatch && trimmed.length < 48 && (/^#{0,3}\s/.test(trimmed) || /^Day\s*\d+/i.test(trimmed) || /?\s*\d+\s*??.test(trimmed))) {
                        if (current) days.push(current);
                        current = { dayNum: dayMatch[1], rawLines: [] };
                    } else if (current) {
                        current.rawLines.push(line);
                    }
                });
                if (current) days.push(current);

                if (!days.length) {
                    days.push({ dayNum: '1', rawLines: lines });
                }

                return days.map(function (d) {
                    var phases = [];
                    var buffer = [];
                    var phaseLabel = '';

                    function flushPhase() {
                        if (phaseLabel || buffer.length) {
                            phases.push({
                                label: phaseLabel,
                                emoji: phaseLabel.indexOf('???') !== -1 ? '???? : phaseLabel.indexOf('???') !== -1 ? '????? : phaseLabel.indexOf('????') !== -1 ? '??' : '',
                                body: buffer.join('\n').replace(/^#{1,3}\s*/gm, '').trim()
                            });
                        }
                        buffer = [];
                    }

                    d.rawLines.forEach(function (ln) {
                        var stripped = ln.replace(/^#{1,3}\s*/g, '').trim();
                        var phaseMatch = stripped.match(/^(???|???|????)\s*[??]\s*(.*)$/);
                        if (phaseMatch) {
                            flushPhase();
                            phaseLabel = phaseMatch[1];
                            if (phaseMatch[2] && phaseMatch[2].trim()) {

                            }

                            phaseLabel = stripped.replace(/[??]\s*$/, '');
                        } else if (stripped) {

                    });
                    flushPhase();

            function pickBackupItineraryKey(destination) {
                var dest = String(destination || '').trim();
                if (!dest) return 'default';
                var packs = window.backupItinerary || {};

                // Exact pack key match first (never accidental substring).
                if (packs[dest] && dest !== 'default') return dest;

                // Explicit city aliases ??pack key (???? content belongs to ?????pack only).
                if (/^(????|Sapporo)$/i.test(dest) || /????|Sapporo/i.test(dest)) {
                    return packs['?????] ? '????? : 'default';
                }

                // Rules next (ordered specific ??broad).
                var i;
                for (i = 0; i < BACKUP_ITINERARY_KEY_RULES.length; i++) {
                    if (BACKUP_ITINERARY_KEY_RULES[i].re.test(dest)) {
                        var ruled = BACKUP_ITINERARY_KEY_RULES[i].key;
                        if (packs[ruled]) return ruled;
                    }
                }

                // Longest contained pack key only (min 2 chars), never prefer ???? over destination.
                var keys = Object.keys(packs).filter(function (k) {
                    return k !== 'default' && k.length >= 2;
                });
                keys.sort(function (a, b) { return b.length - a.length; });
                for (i = 0; i < keys.length; i++) {
                    if (dest.indexOf(keys[i]) !== -1) {
                        return keys[i];
                    }
                }
                return 'default';

            function fitBackupDaysToTrip(pack, payload) {
                if (!pack || !Array.isArray(pack.days) || !pack.days.length) {

                if (clone.days.length > needDays) {

                var msg = String(err.message || '');
                return /limit:\s*0/i.test(msg);
            }

            function isGeminiRpmThrottle(err) {
                if (!err || err.status !== 429) return false;
                var msg = String(err.message || '');
                if (/limit:\s*0/i.test(msg)) return false;
                if (isGeminiBillingDepleted(err)) return false;
                if (/Please retry in [\d.]+s/i.test(msg)) return true;
                if (/free_tier/i.test(msg) && /limit:\s*20/i.test(msg)) return true;
                return false;
            }

            function countParsedTripDays(text) {
                var json = extractJsonFromAiText(text);
                if (!json || !Array.isArray(json.days)) return 0;
                return json.days.length;
            }

            function isGeminiKeyLevelQuota(err) {
                if (!err || err.status !== 429) return false;
                if (isGeminiBillingDepleted(err)) return true;
                var msg = String(err.message || '');
                if (/free_tier/i.test(msg)) return false;
                return /quota exceeded|RESOURCE_EXHAUSTED|exhausted/i.test(msg);
            }

            function isGeminiModelNotFound(status, err) {
                return status === 404 || /not found for API version|is not supported for generateContent/i.test(String((err && err.message) || ''));
            }

            function isGeminiRateLimit(response, result) {
                if (response && response.status === 429) return true;
                if (!result || !result.error) return false;
                var err = result.error;
                return err.code === 429
                    || err.status === 'RESOURCE_EXHAUSTED'
                    || (err.message && /429|quota|rate limit|RESOURCE_EXHAUSTED|exhausted|????/i.test(err.message));
            }

            function extractGeminiText(result) {
                try {
                    var text = result.candidates
                        && result.candidates[0]
                        && result.candidates[0].content
                        && result.candidates[0].content.parts
                        && result.candidates[0].content.parts[0]
                        && result.candidates[0].content.parts[0].text;
                    return String(text || '').trim();
                } catch (e) {
                    return '';
                }
            }

            async function requestGeminiViaBackend(promptText, modelId) {
                var response;
                try {
                    response = await fetch(getSoarvibeApiBase() + '/api/gemini', {
                        method: 'POST',
                        headers: getBackendAuthHeaders(),
                        body: JSON.stringify({
                            prompt: String(promptText || ''),
                            model: modelId
                        })
                    });
                } catch (networkErr) {
                    var netErr = new Error('network');
                    netErr.cause = networkErr;
                    throw netErr;
                }

                var result = {};
                try {
                    result = await response.json();
                } catch (parseErr) {
                    var invalidErr = new Error('invalid_response');
                    invalidErr.cause = parseErr;
                    throw invalidErr;
                }

                if (!response.ok) {
                    console.error('SOARVIBE backend Gemini HTTP ' + response.status, result);
                    if (response.status === 403 || result.error === 'forbidden') {
                        var originErr = new Error(
                            'origin_forbidden: Worker ??????????? +
                            (typeof location !== 'undefined' ? location.origin : '') +
                            '??????? ALLOWED_ORIGINS ????????Worker??
                        );
                        originErr.status = 403;
                        originErr.code = 'origin_forbidden';
                        originErr.responseBody = result;
                        throw originErr;
                    }
                    if (result.error === 'all_keys_exhausted' || response.status === 429) {
                        var details429 = result.details || result;
                        var rateErr = new Error('rate_limit: ' + (result.message || ((details429.error && details429.error.message) || response.status)));
                        rateErr.status = 429;
                        rateErr.responseBody = details429;
                        throw rateErr;
                    }
                    var details = result.details || result;
                    var apiErr = new Error((details.error && details.error.message) ? details.error.message : (result.message || 'api_error'));
                    apiErr.status = response.status;
                    apiErr.responseBody = details;
                    throw apiErr;
                }

                var text = String(result.text || '').trim();
                if (!text) {
                    throw new Error('empty_response');
                }
                return {
                    text: text,
                    keySlot: result.keySlot,
                    keyTotal: result.keyTotal
                };
            }

            async function callGeminiContentViaBackend(promptText, options) {
                options = options || {};
                var maxRetries = options.maxRetries != null ? options.maxRetries : 2;
                var lastError = null;

                for (var modelIdx = 0; modelIdx < GEMINI_MODEL_IDS.length; modelIdx++) {
                    var modelId = GEMINI_MODEL_IDS[modelIdx];
                    for (var retry = 0; retry <= maxRetries; retry++) {
                        try {
                            if (retry > 0) {
                                await sleep(options.fastMode ? 600 * retry : 1200 * Math.pow(2, retry - 1));
                            }
                            console.log('[SOARVIBE] Backend Gemini ??model', modelId, retry ? '(retry ' + retry + ')' : '');
                            var backendResult = await requestGeminiViaBackend(promptText, modelId);
                            console.log('[SOARVIBE] Backend Gemini OK ??model', modelId,
                                backendResult.keySlot ? ('| key ' + backendResult.keySlot + '/' + backendResult.keyTotal) : '',
                                '| chars:', backendResult.text.length);
                            return backendResult.text;
                        } catch (err) {
                            lastError = err;
                            console.warn('[SOARVIBE] Backend Gemini failed model', modelId + ':', err && err.message ? err.message : err);
                            var status = err && err.status;
                            if (isGeminiAuthError(status)) {
                                throw err;
                            }
                            if (status === 429) {
                                if (isGeminiRpmThrottle(err)) {
                                    break;
                                }
                                if (isGeminiModelOnlyQuota(err, modelId)) {
                                    break;
                                }
                                if (isGeminiKeyLevelQuota(err) || isGeminiBillingDepleted(err)) {
                                    throw err;
                                }
                                break;
                            }
                            if (isGeminiModelNotFound(status, err)) {
                                break;
                            }
                            if (isGeminiRetryableStatus(status) && retry < maxRetries) {
                                continue;
                            }
                            break;
                        }
                    }
                }
                throw lastError || new Error('backend_exhausted');
            }

            async function requestGeminiWithKey(promptText, apiKey, modelId) {
                var url = buildGeminiModelUrl(modelId);
                var response;
                try {
                    response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: String(promptText || '') }] }],
                            generationConfig: {
                                temperature: 0.75,
                                maxOutputTokens: 8192,
                                responseMimeType: 'application/json'
                            }
                        })
                    });
                } catch (networkErr) {
                    var netErr = new Error('network');
                    netErr.cause = networkErr;
                    throw netErr;
                }

                var result = {};
                try {
                    result = await response.json();
                } catch (parseErr) {
                    var invalidErr = new Error('invalid_response');
                    invalidErr.cause = parseErr;
                    throw invalidErr;
                }

                if (!response.ok) {
                    console.error('Gemini HTTP ' + response.status + ' [' + modelId + ']', result);
                    if (isGeminiRateLimit(response, result)) {
                        var rateErr = new Error('rate_limit: ' + ((result.error && result.error.message) || response.status));
                        rateErr.status = 429;
                        rateErr.responseBody = result;
                        throw rateErr;
                    }
                    var apiErr = new Error((result.error && result.error.message) ? result.error.message : 'api_error');
                    apiErr.status = response.status;
                    apiErr.responseBody = result;
                    throw apiErr;
                }

                var text = extractGeminiText(result);
                if (!text) {
                    throw new Error('empty_response');
                }
                return text;
            }

            async function callGeminiContent(promptText, options) {
                options = options || {};
                if (shouldUseBackendProxy()) {
                    return callGeminiContentViaBackend(promptText, options);
                }

                var maxRetries = options.maxRetries != null ? options.maxRetries : 2;

                var validKeys = getActiveGeminiApiKeys();
                if (!validKeys.length) {
                    throw new Error('no_valid_key');
                }
                if (areAllGeminiKeysExhausted()) {
                    var depletedErr = new Error('all_keys_exhausted');
                    depletedErr.status = 429;
                    throw depletedErr;
                }

                var lastError = null;
                var startIdx = currentKeyIndex;
                if (startIdx < 0 || startIdx >= validKeys.length) {
                    startIdx = 0;
                    currentKeyIndex = 0;
                }

                var keysTried = 0;
                for (var attempt = 0; attempt < validKeys.length; attempt++) {
                    var keyIndex = (startIdx + attempt) % validKeys.length;
                    var apiKey = validKeys[keyIndex];
                    if (isGeminiKeyExhausted(apiKey)) {
                        continue;
                    }
                    keysTried++;
                    var modelIdx;
                    var keyQuotaHit = false;
                    var keyGotResponse = false;

                    for (modelIdx = 0; modelIdx < GEMINI_MODEL_IDS.length; modelIdx++) {
                        if (keyQuotaHit) break;
                        var modelId = GEMINI_MODEL_IDS[modelIdx];
                        var retry;

                        for (retry = 0; retry <= maxRetries; retry++) {
                            try {
                                if (retry > 0) {
                                    await sleep(options.fastMode ? 600 * retry : 1200 * Math.pow(2, retry - 1));
                                }
                                console.log('[SOARVIBE] Gemini request ??key', keyIndex + 1 + '/' + validKeys.length, 'model', modelId, retry ? '(retry ' + retry + ')' : '');
                                var text = await requestGeminiWithKey(promptText, apiKey, modelId);
                                console.log('[SOARVIBE] Gemini OK ??key', keyIndex + 1, 'model', modelId, '| chars:', text.length);
                                currentKeyIndex = keyIndex;
                                keyGotResponse = true;
                                return text;
                            } catch (err) {
                                lastError = err;
                                var status = err && err.status;
                                console.warn('[SOARVIBE] Gemini failed key', keyIndex + 1, 'model', modelId + ':', err && err.message ? err.message : err);

                                if (isGeminiAuthError(status)) {
                                    console.warn('[SOARVIBE] ???', keyIndex + 1, '?????? ????????????????);
                                    markGeminiKeyExhausted(apiKey);
                                    keyQuotaHit = true;
                                    break;
                                }
                                if (status === 429) {
                                    if (isGeminiRpmThrottle(err)) {
                                        console.warn('[SOARVIBE] Key ' + (keyIndex + 1) + ' ?????? ????????????????????????');
                                        keyQuotaHit = true;
                                        break;
                                    }
                                    if (isGeminiModelOnlyQuota(err, modelId)) {
                                        console.warn('[SOARVIBE] ??? ' + modelId + ' ???????? ?????');
                                        break;
                                    }
                                    if (isGeminiKeyLevelQuota(err) || isGeminiBillingDepleted(err)) {
                                        console.warn('[SOARVIBE] Key ' + (keyIndex + 1) + '/' + validKeys.length + ' ????? ???????????????);
                                        markGeminiKeyExhausted(apiKey);
                                        keyQuotaHit = true;
                                        break;
                                    }
                                    console.warn('[SOARVIBE] 429 ????????????);
                                    break;
                                }
                                if (isGeminiModelNotFound(status, err)) {
                                    break;
                                }
                                if (isGeminiRetryableStatus(status) && retry < maxRetries) {
                                    console.warn('[SOARVIBE] ?????????' + status + ' ??????????);
                                    continue;
                                }
                                break;
                            }
                        }
                        if (lastError && isGeminiAuthError(lastError.status)) {
                            break;
                        }
                    }

                    if (!keyGotResponse && lastError && lastError.status === 429 && !isGeminiRpmThrottle(lastError)) {
                        markGeminiKeyExhausted(apiKey);
                        keyQuotaHit = true;
                    }

                    currentKeyIndex = (keyIndex + 1) % validKeys.length;
                    if (keyQuotaHit && getAvailableGeminiKeys().length) {
                        console.warn('[SOARVIBE] ????????????????index', currentKeyIndex + 1);
                    }
                }

                if (areAllGeminiKeysExhausted()) {
                    var allErr = new Error('all_keys_exhausted');
                    allErr.status = 429;
                    allErr.cause = lastError;
                    throw allErr;
                }
                if (!keysTried) {
                    var skipErr = new Error('all_keys_exhausted');
                    skipErr.status = 429;
                    throw skipErr;
                }
                throw lastError || new Error('exhausted');
            }

            async function generateSingleDayWithKeyRotation(payload, dayNum, totalDays, priorSummary) {
                var validKeys = getActiveGeminiApiKeys();
                if (!validKeys.length) {
                    throw new Error('no_valid_key');
                }
                var prompt = buildGeminiSingleDayRequestText(payload, dayNum, totalDays, priorSummary);
                var parseAttempts = 0;
                var maxParseAttempts = validKeys.length * 2;

                while (!areAllGeminiKeysExhausted() && parseAttempts < maxParseAttempts) {
                    try {
                        var text = await callGeminiContent(prompt, { maxRetries: 1, fastMode: true });
                        return parseSingleDayFromResponse(text, dayNum);
                    } catch (err) {
                        if (isAllKeysExhaustedError(err)) {

                            parseAttempts++;

            async function fetchGeminiItineraryDayByDay(payload) {
                var totalDays = countTripDays(payload.dateStart, payload.dateEnd);
                var days = [];
                var priorSummary = '';
                var anyBackup = false;
                var originForbidden = false;

                for (var d = 1; d <= totalDays; d++) {
                    setGeneratingDayProgress(d, totalDays, payload.destination);
                    try {
                        var dayObj = await generateSingleDayWithKeyRotation(payload, d, totalDays, priorSummary);
                        days.push(dayObj);
                        priorSummary = summarizePriorDays(days);
                    } catch (err) {
                        if (err && (err.code === 'origin_forbidden' || /origin_forbidden/i.test(String(err.message || '')))) {
                            originForbidden = true;
                        }
                        if (isAllKeysExhaustedError(err)) {
                            console.warn('[SOARVIBE] ??????????? ??Day', d, '??????????);
                            var backupDay = getBackupDayForIndex(payload, d - 1);
                            if (backupDay) {
                                days.push(backupDay);
                                anyBackup = true;
                                priorSummary = summarizePriorDays(days);
                            }
                            for (var rest = d + 1; rest <= totalDays; rest++) {
                                startGeneratingStatusRotation(payload.destination, false);
                                backupDay = getBackupDayForIndex(payload, rest - 1);
                                if (backupDay) {
                                    days.push(backupDay);
                                    anyBackup = true;
                                }
                            }
                            break;
                        }
                        console.warn('[SOARVIBE] Day', d, 'AI ??????????? ???', err && err.message ? err.message : err);
                        var fallbackDay = getBackupDayForIndex(payload, d - 1);
                        if (fallbackDay) {
                            days.push(fallbackDay);
                            anyBackup = true;
                            priorSummary = summarizePriorDays(days);
                        }
                    }
                }

                if (!days.length) {
                    return {
                        text: getBackupItineraryRaw(payload),
                        fromBackup: true,
                        reason: originForbidden ? 'origin_forbidden' : 'day_by_day_failed'
                    };
                }

                return {
                    text: JSON.stringify({ days: days }),
                    fromBackup: anyBackup,
                    reason: originForbidden
                        ? 'origin_forbidden'
                        : anyBackup
                          ? 'partial_backup_days'
                          : undefined
                };
            }

            async function repairLazyItineraryDays(aiResult, payload) {
                if (!aiResult || aiResult.fromBackup || !payload) return aiResult;
                var needDays = countTripDays(payload.dateStart, payload.dateEnd);
                if (needDays <= 2) return aiResult;
                var json = extractJsonFromAiText(aiResult.text);
                if (!json || !Array.isArray(json.days) || !json.days.length) return aiResult;

                var lazyDays = [];
                json.days.forEach(function (day, idx) {
                    var dayNum = parseInt(day.day, 10) || idx + 1;
                    if (isLazyItineraryDay(day, dayNum, needDays)) {
                        lazyDays.push(dayNum);
                    }
                });
                if (!lazyDays.length) return aiResult;

                console.warn('[SOARVIBE] ?????, lazyDays.length, '??????????????????????', lazyDays.join(', '));
                var anyBackup = false;
                var priorSummary = '';
                var d;
                for (d = 0; d < json.days.length; d++) {
                    var num = parseInt(json.days[d].day, 10) || d + 1;
                    if (lazyDays.indexOf(num) === -1) {
                        priorSummary = summarizePriorDays(json.days.slice(0, d + 1));
                        continue;
                    }
                    setGeneratingDayProgress(num, needDays, payload.destination);
                    try {
                        var freshDay = await generateSingleDayWithKeyRotation(payload, num, needDays, priorSummary);
                        json.days[d] = freshDay;
                        priorSummary = summarizePriorDays(json.days.slice(0, d + 1));
                    } catch (regenErr) {
                        if (isAllKeysExhaustedError(regenErr)) break;
                        var backupDay = getBackupDayForIndex(payload, num - 1);
                        if (backupDay) {
                            json.days[d] = backupDay;
                            anyBackup = true;
                            priorSummary = summarizePriorDays(json.days.slice(0, d + 1));
                        }
                    }
                }
                return {
                    text: JSON.stringify({ days: json.days }),
                    fromBackup: anyBackup,
                    reason: anyBackup ? 'partial_backup_days' : undefined
                };
            }

            function resolveArticleHeroImage(article) {

            function resolveSectionSecondaryImage(section, usedUrls) {

            function renderMagazineSection(section, article, heroUrl, usedUrls) {
                if (!section) return '';

                    usedUrls[imageInfo.url] = true;

                    });
                }
                if (backBtn) {
                    backBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        goBackCityJournal();
                    });
                }

                shell.addEventListener('click', function (e) {
                    if (e.target.closest('#cjCloseBtn')) {
                        e.preventDefault();
                        closeCityJournal();
                        return;
                    }
                    if (e.target.closest('#cjBackBtn')) {
                        e.preventDefault();
                        goBackCityJournal();
                        return;
                    }
                    var editionBtn = e.target.closest('.cj-edition-card[data-cj-style]');
                    if (editionBtn) {
                        e.preventDefault();
                        openJournalArticle(editionBtn.getAttribute('data-cj-city'), editionBtn.getAttribute('data-cj-style'));
                        return;
                    }
                    if (e.target.id === 'cjApplyBtn' || e.target.closest('#cjApplyBtn')) {
                        applyJournalToTrip();
                    }
                });

                shell.addEventListener('error', function (e) {
                    var img = e.target;
                    if (!img || img.tagName !== 'IMG' || !img.hasAttribute('data-cj-img')) return;
                    handleCityJournalImageError(img);
                }, true);

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && !shell.classList.contains('hidden')) {
                        if (cjState.view === 'article') {
                            goBackCityJournal();
                        } else {
                            closeCityJournal();
                        }
                    }
                });
            }

            function handleMagCityCardImageError(img) {
                if (!img || img.getAttribute('data-mag-card-fallback') === '1') return;
                var step = img.getAttribute('data-mag-card-fallback-step') || '0';
                if (step === '0') {
                    img.setAttribute('data-mag-card-fallback-step', '1');
                    img.src = './cover-photos/default.jpg';
                    return;
                }
                img.setAttribute('data-mag-card-fallback', '1');
                img.src = './assets/city-journal/placeholder-city-journal.svg';
            }

            function initCityJournalCityCards() {
                document.querySelectorAll('.mag-city-card').forEach(function (card) {
                    var img = card.querySelector('img');
                    if (img) {
                        img.addEventListener('error', function () {
                            handleMagCityCardImageError(img);
                        });
                    }
                    card.addEventListener('keydown', function (e) {
                        if (e.key !== 'Enter' && e.key !== ' ') return;
                        e.preventDefault();
                        card.click();
                    });
                });
            }

            window.openCityJournal = openCityJournal;
            window.openJournalArticle = openJournalArticle;
            window.closeCityJournal = closeCityJournal;
            window.openMagazine = openCityJournal;
            window.closeMagazine = closeCityJournal;

            document.querySelectorAll('.quick-tag').forEach(function (tag) {
                tag.addEventListener('click', function () {
                    destinationInput.value = tag.dataset.city;
                    // Do not auto-fill airports ??Preview Mode must stay empty until user expands flight accordion.
                    destinationInput.focus();
                });
            });

            if (destinationInput) {
                destinationInput.addEventListener('change', function () {
                    /* airports remain optional; no auto-fill */
                });
            }

            var flightAirportInputs = [
                flightOutboundNumberInput,
                flightReturnNumberInput,
                flightOutboundFromInput,
                flightOutboundToInput,
                flightReturnFromInput,
                flightReturnToInput
            ];
            flightAirportInputs.forEach(function (inputEl) {
                if (!inputEl) return;
                inputEl.addEventListener('input', updateFlightDateDisplays);
                inputEl.addEventListener('change', updateFlightDateDisplays);
            });

            initCityJournalCityCards();
            initCityJournal();

            advancedToggle.addEventListener('click', function () {
                var isOpen = advancedSettings.classList.toggle('is-open');
                advancedToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });
            document.querySelectorAll('.adv-sub-toggle').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var wrap = btn.closest('.adv-sub');
                    if (!wrap) return;
                    var open = wrap.classList.toggle('is-open');
                    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            });

            generateBtn.addEventListener('click', function () {
                ensureBossDemoFormReady();
                var destination = destinationInput.value.trim();

                if (!destination) {
                    showModal(MSG_DESTINATION_EMPTY, '??');
                    return;
                }
                if (isDestinationBlocked(destination)) {
                    showModal(MSG_DESTINATION_INVALID, '????');
                    return;
                }
                if (!dateStartInput.value || !dateEndInput.value) {
                    showModal(MSG_DATES_INCOMPLETE, '??');
                    return;
                }
                if (isReturnBeforeDeparture()) {
                    showModal(MSG_DATES_REVERSED, '??);
                    return;
                }
                if (!getSelectedTravelStyle()) {
                    showModal(MSG_TRAVEL_STYLE_REQUIRED, '??);
                    return;
                }

                runItineraryGeneration();
            });

            document.querySelectorAll('.nav-soon').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    showModal(MSG_COMING_SOON, '??);
                });
            });

            loadUserCenterData();

            if (window.SOARVIBE_FIREBASE && typeof window.SOARVIBE_FIREBASE.init === 'function') {
                window.SOARVIBE_FIREBASE.init();
            }
            if (window.SOARVIBE_AUTH && typeof window.SOARVIBE_AUTH.start === 'function') {
                // Idempotent: early boot already started Auth; safe to call again.
                window.SOARVIBE_AUTH.start();
                window.SOARVIBE_AUTH.onAuthStateChanged(function (snap) {
                    if (snap && snap.signedIn) {
                        syncCloudUserCenterExtras();
                    }
                });
            }
            if (typeof window.bindSoarvibeAuthUi === 'function') {
                window.bindSoarvibeAuthUi();
            }

            if (navProfile) {
                navProfile.addEventListener('click', function () {
                    closeBookletInAppPreviewIfOpen();
                    if (userWall && !userWall.classList.contains('hidden')) {
                        closeUserWall();
                    } else {
                        openUserWall();
                    }
                });
            }
            if (userWallBack) {
                userWallBack.addEventListener('click', closeUserWall);
            }
            if (userAvatarBtn && userAvatarInput) {
                (function syncAvatarUploadUi() {
                    var flags = window.SOARVIBE_FEATURE_FLAGS || {};
                    var enabled = flags.avatarUploadEnabled === true;
                    var hint = document.getElementById('user-avatar-hint');
                    if (!enabled) {
                        userAvatarBtn.setAttribute('aria-label', '????');
                        if (hint) hint.textContent = '';
                        userAvatarBtn.classList.add('is-avatar-upload-disabled');
                    } else {
                        userAvatarBtn.setAttribute('aria-label', '???????????');
                        if (hint) hint.textContent = '????';
                        userAvatarBtn.classList.remove('is-avatar-upload-disabled');
                    }
                })();
                userAvatarBtn.addEventListener('click', function () {
                    var flags = window.SOARVIBE_FEATURE_FLAGS || {};
                    if (flags.avatarUploadEnabled !== true) {
                        return;
                    }
                    userAvatarInput.click();
                });
                userAvatarInput.addEventListener('change', function () {
                    var flags = window.SOARVIBE_FEATURE_FLAGS || {};
                    if (flags.avatarUploadEnabled !== true) {
                        userAvatarInput.value = '';
                        return;
                    }
                    var file = userAvatarInput.files && userAvatarInput.files[0];
                    if (!file) return;
                    var AUTH = window.SOARVIBE_AUTH;
                    if (AUTH && AUTH.isSignedIn() && AUTH.uploadAvatar) {
                        AUTH.uploadAvatar(file)
                            .then(function (url) {
                                applyUserAvatar(url);
                                try {
                                    localStorage.setItem(USER_AVATAR_KEY, url);
                                } catch (e) { /* silent */ }
                            })
                            .catch(function (err) {
                                alert((err && err.message) || '?????????');
                            });
                        userAvatarInput.value = '';
                        return;
                    }
                    var reader = new FileReader();
                    reader.onload = function () {
                        try {
                            localStorage.setItem(USER_AVATAR_KEY, reader.result);
                            applyUserAvatar(reader.result);
                        } catch (e) {
                            console.warn('Avatar save failed (storage full?):', e);
                            applyUserAvatar(reader.result);
                        }
                    };
                    reader.readAsDataURL(file);
                    userAvatarInput.value = '';
                });
            }
            if (userNicknameInput) {
                userNicknameInput.addEventListener('change', function () {
                    var val = userNicknameInput.value.trim() || DEFAULT_USER_NICKNAME;
                    userNicknameInput.value = val;
                    try {
                        localStorage.setItem(USER_NICKNAME_KEY, val);
                    } catch (e) { /* silent */ }
                    if (window.SOARVIBE_AUTH && window.SOARVIBE_AUTH.isSignedIn() && window.SOARVIBE_AUTH.updateProfile) {
                        window.SOARVIBE_AUTH.updateProfile({
                            nickname: val,
                            displayName: val
                        }).catch(function (err) {
                            console.warn('nickname sync failed', err);
                        });
                    }
                });
                userNicknameInput.addEventListener('blur', function () {
                    userNicknameInput.dispatchEvent(new Event('change'));
                });
            }
            if (userChecklist) {
                userChecklist.querySelectorAll('.user-check-item').forEach(function (li) {
                    var cb = li.querySelector('input[type="checkbox"]');
                    if (!cb) return;
                    cb.addEventListener('change', function () {
                        syncCheckItemVisual(li);
                        saveUserChecklistState();
                    });
                });
            }
            [userNoteShopping, userNoteFood, userNoteSpots].forEach(function (el) {
                if (!el) return;
                el.addEventListener('input', saveUserNotes);
                el.addEventListener('blur', saveUserNotes);
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    refreshSoarvibeViewportHeight();
                    purgeSoarvibeOldCaches();
                    var swUrl = './service-worker.js?v=' + encodeURIComponent(SOARVIBE_APP_BUILD);
                    navigator.serviceWorker.register(swUrl).then(function (reg) {
                        if (reg && reg.update) reg.update();
                        if (reg && reg.waiting) {
                            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                        if (reg) {
                            reg.addEventListener('updatefound', function () {
                                var worker = reg.installing;
                                if (!worker) return;
                                worker.addEventListener('statechange', function () {
                                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                        worker.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                });
                            });
                        }
                    }).catch(function (err) {
                        console.warn('[SOARVIBE] Service worker registration failed:', err);
                    });
                });
            }

            refreshSoarvibeViewportHeight();
            installSoarvibeKeyboardGuard();
            checkPdfExportCrashRecovery();
            purgeSoarvibeOldCaches();
            updateBookletPreviewBuildLabel();
            installAppResumeLayoutGuard();
            console.info('[SOARVIBE] build', SOARVIBE_APP_BUILD);
            window.addEventListener('resize', function () {
                if (!document.documentElement.classList.contains('soarvibe-keyboard-open')) {
                    refreshSoarvibeViewportHeight();
                }
            });
            window.addEventListener('orientationchange', function () {
                document.documentElement.classList.remove('soarvibe-keyboard-open');
                soarvibeLockedLayoutHeight = 0;
                setTimeout(function () { refreshSoarvibeViewportHeight({ force: true }); }, 120);
            });
            window.addEventListener('pageshow', function (ev) {
                if (ev.persisted) {
                    refreshSoarvibeViewportHeight({ force: true });
                }
                if (soarvibePdfSessionActive && !pdfExportInProgress &&
                    !document.documentElement.classList.contains('booklet-preview-open') &&
                    !document.documentElement.classList.contains('pdf-export-busy') &&
                    !document.documentElement.classList.contains('ios-print-active')) {
                    setTimeout(returnHomeAfterPdfViewerClose, 120);
                }
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function () {
                    if (document.documentElement.classList.contains('soarvibe-keyboard-open') || isSoarvibeKeyboardLikelyOpen()) {
                        return;
                    }
                    refreshSoarvibeViewportHeight();
                });
            }

            if (navHome) {
                navHome.addEventListener('click', goToHome);
            }

            if (navSearch) {
                navSearch.addEventListener('click', function () {
                    closeBookletInAppPreviewIfOpen();
                    if (kkdayAffiliateMenu && !kkdayAffiliateMenu.classList.contains('hidden')) {
                        closeKkdayAffiliateMenu();
                    } else {
                        openKkdayAffiliateMenu();
                    }
                });
            }
            if (exclusiveHubBack) {
                exclusiveHubBack.addEventListener('click', function () {
                    if (kkdayAffiliateMenu && kkdayAffiliateMenu.classList.contains('foodspot-sheet-mode')) {
                        resetFoodspotPanelModes();
                    }
                    showExclusiveHubMain();
                });
            }
            if (kkdayAffiliateClose) {
                kkdayAffiliateClose.addEventListener('click', closeKkdayAffiliateMenu);
            }
            if (kkdayAffiliateMenu) {
                kkdayAffiliateMenu.addEventListener('click', function (e) {
                    if (e.target === kkdayAffiliateMenu) closeKkdayAffiliateMenu();
                });
                kkdayAffiliateMenu.querySelectorAll('[data-affiliate-type]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        handleKkdayAffiliateClick(btn.getAttribute('data-affiliate-type'));
                    });
                });
            }

            btnSaveTrip.addEventListener('click', saveCurrentTrip);
            if (btnExportBooklet) {
                btnExportBooklet.addEventListener('click', exportTravelBooklet);
            }
            var bookletPreviewClose = document.getElementById('booklet-preview-close');
            var bookletPreviewPrint = document.getElementById('booklet-preview-print');
            if (bookletPreviewClose) {
                bookletPreviewClose.addEventListener('click', closeBookletInAppPreview);
            }
            if (bookletPreviewPrint) {
                if (shouldUseBookletInAppPreview()) {
                    bookletPreviewPrint.textContent = '??? ???? PDF';
                }
                bookletPreviewPrint.addEventListener('click', handleBookletPreviewAction);
            }
            var bookletPdfProgressRecover = document.getElementById('booklet-pdf-progress-recover');
            if (bookletPdfProgressRecover) {
                bookletPdfProgressRecover.addEventListener('click', recoverBookletPdfFromLoadingOverlay);
            }
            var bookletPdfViewerClose = document.getElementById('booklet-pdf-viewer-close');
            var bookletPdfViewerShare = document.getElementById('booklet-pdf-viewer-share');
            if (bookletPdfViewerClose) {
                bookletPdfViewerClose.addEventListener('click', closeBookletPdfViewer);
            }
            if (bookletPdfViewerShare) {
                bookletPdfViewerShare.addEventListener('click', shareBookletPdfFromViewer);
            }

            navFavorite.addEventListener('click', function () {
                closeBookletInAppPreviewIfOpen();
                if (savedTripsMenu.classList.contains('hidden')) {
                    openSavedTripsMenu();
                } else {
                    closeSavedTripsMenu();
                }
            });

            savedTripsClose.addEventListener('click', closeSavedTripsMenu);
            savedTripsMenu.addEventListener('click', function (e) {
                if (e.target === savedTripsMenu) closeSavedTripsMenu();
            });

            alertClose.addEventListener('click', hideAlert);
            alertEl.addEventListener('click', function (e) {
                if (e.target === alertEl) hideAlert();
            });

            dateStartInput.addEventListener('change', function () {
                syncTripDateState();
                refreshAllAccommodationCheckInOptions();
                refreshAddAccommodationButtonState();
            });
            dateStartInput.addEventListener('input', function () {
                syncTripDateState();
                refreshAllAccommodationCheckInOptions();
                refreshAddAccommodationButtonState();
            });
            dateEndInput.addEventListener('change', function () {
                syncTripDateState();
                refreshAllAccommodationCheckInOptions();
                refreshAddAccommodationButtonState();
            });
            dateEndInput.addEventListener('input', function () {
                syncTripDateState();
                refreshAllAccommodationCheckInOptions();
                refreshAddAccommodationButtonState();
            });
            if (flightDepartureTimeInput) {
                flightDepartureTimeInput.addEventListener('change', function () {
                    suggestOutboundArrivalTime(true);
                    updateTimePickerDisplays();
                });
                flightDepartureTimeInput.addEventListener('input', function () {
                    suggestOutboundArrivalTime(true);
                    updateTimePickerDisplays();
                });
            }
            if (flightArrivalTimeInput) {
                flightArrivalTimeInput.addEventListener('change', function () {
                    updateTimePickerDisplays();
                });
                flightArrivalTimeInput.addEventListener('input', function () {
                    updateTimePickerDisplays();
                });
            }
            if (flightReturnTimeInput) {
                flightReturnTimeInput.addEventListener('change', function () {
                    updateTimePickerDisplays();
                });
                flightReturnTimeInput.addEventListener('input', function () {
                    updateTimePickerDisplays();
                });
            }
            [flightOutboundFromInput, flightOutboundToInput].forEach(function (el) {
                if (!el) return;
                el.addEventListener('change', function () {
                    suggestOutboundArrivalTime(true);
                });
                el.addEventListener('blur', function () {
                    suggestOutboundArrivalTime(false);
                });
            });
            if (advancedTransportSelect) {
                advancedTransportSelect.addEventListener('change', function () {
                    var transportLabel = getCustomerSelectedTransport();
                    window.customerSelectedTransport = transportLabel;
                    var transportEl = document.getElementById('info-transport');
                    if (transportEl) {
                        transportEl.textContent = transportLabel;
                    }
                });
            }
            syncTripDateState();
            initAccommodationsForm();
            updateTimePickerDisplays();
            if (destinationInput && destinationInput.value.trim()) {
                suggestFlightAirportsForDestination(destinationInput.value.trim());
            }

            document.querySelectorAll('input[name="travel-style"]').forEach(function (radio) {
                radio.addEventListener('change', function () {
                    syncCurrentStyleFromUi();
                    if (phoneScroll) {
                        phoneScroll.scrollLeft = 0;
                    }
                });
            });
            syncCurrentStyleFromUi();

            var travelStyleScroll = document.getElementById('travel-style-scroll');
            if (travelStyleScroll) {
                travelStyleScroll.addEventListener('wheel', function (e) {
                    var canScrollX = travelStyleScroll.scrollWidth > travelStyleScroll.clientWidth;
                    if (!canScrollX) return;
                    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                        e.preventDefault();
                        travelStyleScroll.scrollLeft += e.deltaX !== 0 ? e.deltaX : e.deltaY;
                    }
                }, { passive: false });
            }

            var recommendScroll = document.getElementById('mag-city-list');
            if (recommendScroll) {
                recommendScroll.addEventListener('wheel', function (e) {
                    var canScrollX = recommendScroll.scrollWidth > recommendScroll.clientWidth;
                    if (!canScrollX) return;
                    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                        e.preventDefault();
                        recommendScroll.scrollLeft += e.deltaX !== 0 ? e.deltaX : e.deltaY;
                    }
                }, { passive: false });
            }
        })();
    </script>

</body>

</html>
